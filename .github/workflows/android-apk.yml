name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Test frontend core
        working-directory: frontend
        run: npm test

      - name: Build web app
        working-directory: frontend
        run: npm run build

      - name: Validate Capacitor config
        working-directory: frontend
        run: |
          node -e "const c=require('./capacitor.config.json'); if (!c.appId || !c.appName || !c.webDir) { throw new Error('capacitor.config.json incompleto') } console.log('Capacitor config OK:', c.appId)"

      - name: Create Android project
        working-directory: frontend
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        working-directory: frontend
        run: npx cap sync android

      - name: Apply Android branding
        working-directory: frontend
        run: npm run android:brand

      - name: Build debug APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pega-texto-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
